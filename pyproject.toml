[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartresearch-chatbot"
version = "0.2.0"
description = "Autonomous Agentic RAG assistant combining vector memory with real-time web intelligence and academic research synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "SmartResearch Team" }
]
keywords = ["rag", "llm", "gemini", "openrouter", "research", "streamlit", "vector-search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "pypdfium2>=4.30.0",
    "numpy>=1.26.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[project.scripts]
smartresearch = "cli:main"
smartresearch-cli = "cli:main"

[tool.setuptools]
py-modules = ["config", "cli", "app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"app.py" = ["E402"]
"core/agent_router.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
